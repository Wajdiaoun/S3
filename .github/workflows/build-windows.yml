name: Build Windows installer
on:
  push:
    branches: [feature/windows-native]
    tags: ['windows-v*']
  pull_request:
    paths: ['windows/**', '.github/workflows/build-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt pyinstaller
      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name NFS2S3 --add-data "windows/nfs2s3_engine.py;." windows/nfs2s3_windows.py
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/NFS2S3.exe package/
          "NFS2S3 Windows x64 - Lancez NFS2S3.exe. Aucun WSL, Bash ou Python requis. Le dossier NFS doit être accessible depuis Windows et monté avant le transfert." | Set-Content package/LISEZMOI.txt -Encoding UTF8
          Compress-Archive -Path package/* -DestinationPath NFS2S3-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NFS2S3-Windows-x64
          path: NFS2S3-Windows-x64.zip
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v2
        with:
          files: NFS2S3-Windows-x64.zip
